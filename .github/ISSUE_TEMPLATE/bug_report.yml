name: Comunicar um erro
description: Comunicar um preço incorreto, uma correspondência de ISBN errada ou um problema na extensão
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Inclui o endereço da loja e o ISBN, sem dados pessoais.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Sistema operativo, navegador (Chrome/Firefox/Edge), versões do navegador e da extensão e tipo de instalação (pasta ou pacote).
    validations:
      required: true
