name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-test:
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build:all
      - run: npm run store-listing:check
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/*-*.zip
          retention-days: 30
  e2e-tests:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npx playwright install --with-deps chromium firefox msedge
      - run: timeout 300 npm run test:e2e
      - run: npm run test:e2e:screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-screenshots
          path: |
            work/*.png
            store-listing/screenshots/
          retention-days: 30
  # Preserve existing branch-protection check names during the migration.
  unit:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Lint, format, unit tests and all browser builds passed.'
  browser:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Browser tests passed.'
