name: Publicação
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de uma versão existente (v0.1.5)
        required: true
        type: string
      stores:
        description: Lojas onde publicar
        type: choice
        options: [none, all, chrome, firefox, edge]
        default: none
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
  target:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      stores: ${{ steps.tag.outputs.stores }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          STORES: ${{ inputs.stores || 'all' }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "stores=$STORES" >> "$GITHUB_OUTPUT"
  build-release:
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.target.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verificar a versão a publicar
        env:
          TAG: ${{ needs.target.outputs.tag }}
        run: node --input-type=module -e "import fs from 'node:fs'; if ('v'+JSON.parse(fs.readFileSync('package.json')).version !== process.env.TAG) process.exit(1)"
      - run: npm ci
      - run: npm run check && npm test && npm run build:all
      - name: Gerar o pacote de submissão quando a versão o permitir
        run: |
          if [ -f scripts/store-pack.mjs ]; then
            npm run store-listing:check && npm run store-listing:pack
          else
            echo "::notice::Esta versão é anterior ao pacote de submissão para várias lojas."
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.target.outputs.tag }}
          files: dist/*-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: |
            dist/*-chrome.zip
            dist/*-firefox.zip
            dist/*-edge.zip
          retention-days: 7
  publish-to-chrome:
    needs: [target, build-release]
    if: ${{ !cancelled() && needs.build-release.result == 'success' && vars.CHROME_PUBLISH_ENABLED == 'true' && (needs.target.outputs.stores == 'all' || needs.target.outputs.stores == 'chrome') }}
    runs-on: ubuntu-latest
    environment: chrome-store
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist
      - name: Verificar o ID de publicador Chrome
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        run: |
          if [ -z "$CHROME_PUBLISHER_ID" ]; then
            echo "::error title=Chrome::A variável de repositório ou de ambiente CHROME_PUBLISHER_ID não está definida. Encontra o valor no Chrome Web Store Developer Dashboard, em Publisher > Settings."
            exit 1
          fi
      - uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: dist/*-chrome.zip
          extension-id: ${{ vars.CHROME_EXTENSION_ID }}
          publisher-id: ${{ vars.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
          glob: true
  publish-to-firefox:
    needs: [target, build-release]
    if: ${{ !cancelled() && needs.build-release.result == 'success' && vars.FIREFOX_PUBLISH_ENABLED == 'true' && (needs.target.outputs.stores == 'all' || needs.target.outputs.stores == 'firefox') }}
    runs-on: ubuntu-latest
    environment: firefox-store
    timeout-minutes: 20
    # Store uploads use store secrets; GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read

    steps:
      # Checkout first: it cleans the workspace, so it must run before the download.
      - name: Obter o código
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.target.outputs.tag }}
          persist-credentials: false

      # The AMO script comes from the workflow's own commit, not the tag: a dispatch for
      # an older tag would otherwise run that tag's script. It reads
      # CHANGELOG.md, the screenshots and the version from the tag checkout (--root .).
      - name: Obter as ferramentas de publicação
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts

      - name: Descarregar os artefactos
        uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # A rerun for a version AMO already has must not upload again (AMO answers 409
      # "Version X already exists"), but must still set the notes and previews.
      - name: Verificar se esta versão já existe no AMO
        id: amo-version
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node .release-tools/scripts/amo-release.mjs --check-version --root .

      - name: Enviar para o Firefox Add-ons
        id: upload
        if: steps.amo-version.outputs.exists != 'true'
        continue-on-error: true
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: 'livros-mais-baratos-pt@rfsbraz.github.io'
          xpi-path: dist/*-firefox.zip
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}

      # A failed upload is fine only if AMO has the version anyway (a 409 from a race
      # with an earlier attempt). Otherwise the job fails here.
      - name: Confirmar a versão no AMO
        if: steps.upload.outcome == 'failure'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node .release-tools/scripts/amo-release.mjs --check-version --require --root .

      # The action cannot send release notes or previews, so this step does it with the
      # same AMO key: the CHANGELOG.md section for this version becomes the release
      # notes, and the listing previews are synced to store-listing/screenshots/*.png.
      # See store-listing/AUTOMATION.md.
      - name: Atualizar notas e imagens no AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node .release-tools/scripts/amo-release.mjs --apply --root .

      - name: Sincronizar os textos da ficha
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -d store-listing/locales ]; then
            node .release-tools/scripts/amo-listing.mjs --apply --root .
          else
            echo "::notice::Esta versão é anterior aos textos partilhados das fichas; o texto foi mantido."
          fi

  publish-to-edge:
    needs: [target, build-release]
    if: ${{ !cancelled() && needs.build-release.result == 'success' && vars.EDGE_PUBLISH_ENABLED == 'true' && (needs.target.outputs.stores == 'all' || needs.target.outputs.stores == 'edge') }}
    runs-on: ubuntu-latest
    environment: edge-store
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.target.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Obter as ferramentas de publicação
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts
      - name: Gerar as notas de certificação
        id: notes
        run: node .release-tools/scripts/edge-cert-notes.mjs --github-output --root .
      - uses: actions/download-artifact@v8
        with:
          name: browser-extensions
          path: dist
      - run: mv dist/*-edge.zip dist/edge.zip
      - uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: dist/edge.zip
          notes-for-certification: ${{ steps.notes.outputs.notes }}
