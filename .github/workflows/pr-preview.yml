name: Instruções de instalação do PR
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  instructions:
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of pull-request code in this privileged workflow.
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- comment-tag: extension-install -->';
            const number = context.payload.pull_request.number;
            const body = `${marker}\nPara testar esta extensão localmente:\n\n\`\`\`sh\ngh pr checkout ${number} --repo ${context.repo.owner}/${context.repo.repo}\nnpm ci\nnpm run build\n\`\`\`\n\nAbre chrome://extensions, ativa o modo de programador e carrega a pasta dist/chrome/. Confirma o ISBN e o preço apresentado na página da loja. A execução de CI também disponibiliza o ficheiro ZIP extension-package.`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
