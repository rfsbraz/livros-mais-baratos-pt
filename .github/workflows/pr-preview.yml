name: PR installation instructions
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  instructions:
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of pull-request code in this privileged workflow.
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- comment-tag: extension-install -->';
            const number = context.payload.pull_request.number;
            const body = `${marker}\nTo test this extension locally:\n\n\`\`\`sh\ngh pr checkout ${number} --repo ${context.repo.owner}/${context.repo.repo}\nnpm ci\nnpm run build\n\`\`\`\n\nOpen chrome://extensions, enable Developer mode, and load the dist/chrome/ folder. No Docker service or pre-built PR image is needed. Check the ISBN and displayed price against the store page. The CI run also provides a extension-package ZIP artifact.`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
