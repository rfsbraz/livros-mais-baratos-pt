name: Firefox listing
on:
  push:
    branches: [main]
    paths:
      - store-listing/listing.json
      - store-listing/locales/**
      - scripts/amo-listing.mjs
      - scripts/listing.mjs
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed listing text to AMO
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: firefox-listing
  cancel-in-progress: false
jobs:
  listing:
    runs-on: ubuntu-latest
    environment: firefox-store
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preview listing
        run: node scripts/amo-listing.mjs
      - name: Apply listing
        if: ${{ (github.event_name == 'push' || inputs.apply) && vars.FIREFOX_PUBLISH_ENABLED == 'true' }}
        run: node scripts/amo-listing.mjs --apply
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
