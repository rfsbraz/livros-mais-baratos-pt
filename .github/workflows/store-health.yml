name: Live store page checks
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { mkdir, writeFile } = require('node:fs/promises');
            const { selectedStores } = await import(pathToFileURL(resolve('scripts/health-schedule.mjs')).href);
            const { findMonitorIssue, readFailures } = await import(pathToFileURL(resolve('scripts/report-store-health.mjs')).href);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'all', per_page: 100 });
            const stores = selectedStores(['--hourly'], new Date(run.created_at));
            const failures = readFailures(findMonitorIssue(issues)?.body);
            await mkdir('work', { recursive: true });
            await writeFile('work/store-plan.json', JSON.stringify({ stores, failures }));
            core.info('Planned stores: ' + stores.join(', '));
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: timeout 780 npm run test:live
        env:
          HEALTH_PLAN: work/store-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-health
          path: work/store-health.json
          if-no-files-found: warn
          retention-days: 14
  report:
    needs: probe
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.probe.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: store-health
          path: work
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { readFile } = require('node:fs/promises');
            const { syncIssue } = await import(pathToFileURL(resolve('scripts/report-store-health.mjs')).href);
            let report = null;
            try { report = JSON.parse(await readFile('work/store-health.json', 'utf8')); } catch {}
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await syncIssue({ github, repo: context.repo, report, runUrl });
