name: Live store page checks
on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/*health*'
      - 'scripts/live-monitor.mjs'
      - 'package*.json'
      - '.github/workflows/store-health.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: timeout 1200 npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-health
          path: work/store-health.json
          if-no-files-found: warn
          retention-days: 14
  report:
    needs: probe
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.probe.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: store-health
          path: work
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { readFile } = require('node:fs/promises');
            const { syncIssue } = await import(pathToFileURL(resolve('scripts/report-store-health.mjs')).href);
            let report = null;
            try { report = JSON.parse(await readFile('work/store-health.json', 'utf8')); } catch {}
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await syncIssue({ github, repo: context.repo, report, runUrl });
