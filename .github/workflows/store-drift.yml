name: Store drift
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/store-maintenance.mjs drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-maintenance
          path: work/store-maintenance/
          retention-days: 7
  report:
    needs: check
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: store-maintenance
          path: report
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('report/report.json'));
            for (const result of report.results) {
              if (result.status === 'skipped' || (report.mode === 'drift' && result.status === 'error')) continue;
              const title = `Store ${report.mode}: ${result.store}`;
              const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open'});
              const issue = issues.find(i => i.title === title && !i.pull_request);
              if (result.status === 'clean') {
                if (issue) await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed'});
              } else {
                const body = `${title} needs attention. Status: ${result.status}. ${result.detail || 'Compare the live listing with store-listing/metadata/description-pt-PT.txt.'}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                if (issue) await github.rest.issues.update({...context.repo, issue_number:issue.number, body});
                else await github.rest.issues.create({...context.repo, title, body});
              }
            }
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/store-drift.yml/enable" --silent
