name: Publicar Worker de métricas

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta da release a republicar (v0.1.6)
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'worker/**'
      - 'tests/unit/metrics-worker.test.js'
      - '.github/workflows/metrics-worker-release.yml'

permissions:
  contents: read

concurrency:
  group: metrics-worker-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testar o Worker
        run: node --test tests/unit/metrics-worker.test.js
      - name: Validar o deploy sem credenciais
        run: npx wrangler deploy --dry-run --config worker/wrangler.toml

  deploy:
    needs: verify
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: metrics-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirmar a versão da release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node --input-type=module -e "import fs from 'node:fs'; if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(process.env.TAG) || 'v' + JSON.parse(fs.readFileSync('package.json')).version !== process.env.TAG) process.exit(1)"
      - name: Confirmar a configuração da conta
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare::Define a variável CLOUDFLARE_ACCOUNT_ID antes de publicar o Worker."
            exit 1
          fi
      - name: Publicar o Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_METRICS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/wrangler.toml
      - name: Confirmar o endpoint publicado
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          METRICS_URL: https://metrics-livros.steamhardwarestock.com/v1/batch
        run: |
          status=$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: chrome-extension://ongoinfbkmfffpmnkinhnoepdclbkenc' \
            "$METRICS_URL")
          test "$status" = 204
          {
            echo "## Worker de métricas publicado"
            echo
            echo "- Versão: \`$TAG\`"
            echo "- Endpoint: $METRICS_URL"
            echo "- Verificação HTTP OPTIONS: $status"
          } >> "$GITHUB_STEP_SUMMARY"
