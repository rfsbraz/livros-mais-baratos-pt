name: Integração automática de correções do Dependabot
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Exigir verificações obrigatórias antes de ativar a integração automática
        id: protection
        run: |
          if gh api "repos/$REPO/branches/$BASE/protection" --jq '.required_status_checks.contexts | (index("unit") != null and index("browser") != null)' 2>/dev/null | grep -qx true; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Integração automática ignorada: as verificações obrigatórias do ramo estão indisponíveis ou não podem ser confirmadas.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dependabot/fetch-metadata@v2
        if: steps.protection.outputs.enabled == 'true'
        id: meta
      - if: steps.protection.outputs.enabled == 'true' && steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
